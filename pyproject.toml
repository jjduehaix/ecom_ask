[project]
name = "ecom-ask"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "asyncmy>=0.2.16",
    "cryptography>=50.0.2",
    "elasticsearch[async]>=8,<9",
    "fastapi[standard]>=0.159.1",
    "greenlet>=3.5.6",
    "huggingface-hub>=1.33.0",
    "jieba>=0.42.1",
    "langchain>=1.4.7",
    "langchain-deepseek>=1.1.1",
    "langchain-huggingface>=1.2.3",
    "langgraph>=1.2.16",
    "loguru>=0.7.3",
    "omegaconf>=2.4.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.1",
    "sqlalchemy>=2.1.6",
]
[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "ruff>=0.11.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]